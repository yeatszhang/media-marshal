name: media-marshal
services:
  media-marshal:
    image: media-marshal-local:${MEDIA_MARSHAL_LOCAL_TAG:-codex-fallback}
    platform: linux/amd64
    build:
      context: ../../build-artifacts/local/docker
      dockerfile: backend.Dockerfile
    pull_policy: never
    container_name: media-marshal
    restart: unless-stopped
    ports:
      - "127.0.0.1:8080:8080"
    volumes:
      - type: bind
        source: ${MEDIA_MARSHAL_DATA_DIR:?请通过 scripts/local-service.sh 启动服务}
        target: /data
        bind:
          create_host_path: false
      - type: bind
        source: ${MEDIA_MARSHAL_MEDIA_ROOT:-/Volumes/Seagate}
        target: /media
        bind:
          create_host_path: false
    environment:
      MEDIA_MARSHAL_PARSER_URL: http://parser:8000
      MEDIA_MARSHAL_CONFIDENCE_THRESHOLD: "0.8"
      MEDIA_MARSHAL_DEBUG: "false"
      TZ: Asia/Shanghai
    depends_on:
      parser:
        condition: service_healthy
  portal:
    image: media-marshal-portal-local:${MEDIA_MARSHAL_LOCAL_TAG:-codex-fallback}
    platform: linux/amd64
    build:
      context: ../../build-artifacts/local/docker
      dockerfile: frontend.Dockerfile
    pull_policy: never
    container_name: media-marshal-portal
    restart: unless-stopped
    ports:
      - "127.0.0.1:3000:80"
    depends_on:
      - media-marshal
  parser:
    image: ghcr.io/media-marshal/media-marshal-parser@sha256:489eb26d1504d4390701a0bc003814dd78fe737b79d4cd2e9929efc1736844e9
    platform: linux/amd64
    container_name: media-marshal-parser
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health', timeout=3).read()"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 10s

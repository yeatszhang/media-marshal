name: 桌面原型验证

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'apps/desktop/**'
      - 'packages/**'
      - 'scripts/**'
      - 'package*.json'
      - '*config*.json'
      - 'vitest.config.ts'
      - '.github/workflows/desktop-prototype.yml'
      - 'tools/desktop-parser/**'
      - 'tools/desktop-files/**'
      - 'tools/desktop-agent/**'
      - '.agents/skills/desktop-development-loop/**'
      - 'AGENTS.md'

permissions:
  contents: read

jobs:
  desktop:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        os: [macos-14, macos-15-intel, windows-2022]
    env:
      CSC_IDENTITY_AUTO_DISCOVERY: 'false'
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '22.23.1'
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11.14'
      - run: python -m pip install --require-hashes -r tools/desktop-parser/requirements-build.txt
      - run: python -m unittest discover -s tools/desktop-parser/tests
      - run: python tools/desktop-parser/build.py
      - run: python tools/desktop-parser/smoke.py
      - run: npm ci
      - if: runner.os == 'macOS'
        run: npm run desktop:prepare-native-files
      - run: npm run typecheck
      - run: npm run check:boundaries
      - run: npm run check:framework
      - run: npm test
      - run: npm run desktop:rebuild
      - run: npm run desktop:build
      - run: npm run test:electron-node
      - run: npm run test:desktop
      - run: npm run desktop:pack
      - run: npm run test:packaged
      - name: 导出已登记的脱敏证据
        if: always()
        continue-on-error: true
        run: npm run --silent desktop:agent:ci:export
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: desktop-evidence-${{ matrix.os }}
          path: test-results/agent/exports/
          if-no-files-found: ignore

  desktop-agent-smoke:
    name: 开发工具后台闭环
    runs-on: macos-14
    timeout-minutes: 30
    env:
      CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      MARSHAL_E2E_MODE: background
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v5
        with:
          node-version: '22.23.1'
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11.14'
      - run: python -m pip install --require-hashes -r tools/desktop-parser/requirements-build.txt
      - run: python tools/desktop-parser/build.py
      - run: npm ci
      - run: npm run test:desktop-agent
      - run: npm run typecheck:desktop-agent
      - name: 生成当前目录包后刷新共享开发资源
        run: |
          node --disable-warning=ExperimentalWarning --experimental-strip-types tools/desktop-agent/test-build.ts packaged
          node --disable-warning=ExperimentalWarning --experimental-strip-types tools/desktop-agent/test-build.ts development
      - name: 协议、驱动负例、隐私、故障采集和自有资源回收
        run: npm run --silent test:desktop-agent:smoke
      - name: 失败时仍尽力导出已登记证据
        if: always()
        continue-on-error: true
        run: npm run --silent desktop:agent:ci:export
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: desktop-agent-safe-evidence
          path: test-results/agent/exports/
          if-no-files-found: ignore
